# A free Supabase project is paused after seven days without database activity.
# Podium runs a fest once a term, so it would be paused almost every time
# someone opened it. This reads one row every three days, which counts as
# activity and keeps the project awake. It costs nothing.
#
# Two repository secrets are needed, under Settings, Secrets and variables,
# Actions:
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon public key, the same one the site uses
#
# The anon key is safe here and in the browser: it can only do what the row
# level policies allow. The service_role key must never be used in this file.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'     # every third day, 06:17 UTC
  workflow_dispatch:            # and whenever you press the button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=last_seen&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP $code"
          cat /tmp/out.json

          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer with 200. The project may be paused already, or the secrets are wrong."
            exit 1
          fi
